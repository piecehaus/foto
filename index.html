<!DOCTYPE html>
<html lang="ko">
<head>
	<link rel="stylesheet" href="style.css">
	<meta charset="utf-8">
	<title>foto</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<style>
		* {
			box-sizing: border-box;
		}

		/* 화면 자체는 고정: 페이지 전체 스크롤 없음 */
		html, body {
			height: 100%;
			overflow: hidden;
		}

		body {
			display: flex;
			flex-direction: column;          /* 제목 줄 → 섹션 순서로 위아래 */
			margin: 0;
			background: white;
			color: black;
			font-family: sans-serif;
			font-size: 15px;
			line-height: 1.5;
		}

		a {
			color: black;
		}

		/* 맨 위 제목 줄 */
		.head {
			padding: 10px 12px;
			border-bottom: 1px solid black;
		}

		/* 세로 3섹션: 제목 줄 아래 남는 높이를 전부 차지 */
		.wall {
			flex: 1;
			min-height: 0;
			display: flex;
		}

		.col {
			flex: 1;
			min-width: 0;
			padding: 12px;
			overflow-y: auto;                /* 스크롤은 섹션 안에서만 */
			border-right: 1px solid black;   /* 섹션 사이 세로선 */
		}

		.col:last-child {
			border-right: 0;
		}

		/* 사진·영상: 섹션 너비에 맞춰 위아래로 쭈루룩 */
		.col img,
		.col video,
		.col .embed {
			display: block;
			width: 100%;
			height: auto;
			margin-bottom: 12px;             /* 사진·영상 사이 간격 */
		}

		/* 유튜브·비메오 영상 칸: 가로 16 : 세로 9 */
		.col .embed {
			aspect-ratio: 16 / 9;
		}

		.col .embed iframe {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
		}

		.msg {
			padding: 12px;
		}

		/* 모바일: 3섹션은 그대로, 여백만 줄이기 */
		@media screen and (max-width: 700px) {
			.col {
				padding: 6px;
			}

			.col img,
			.col video,
			.col .embed {
				margin-bottom: 6px;
			}
		}
	</style>
</head>
<body>

<div class="head">I capture the natural beauty of people and the world.
Based in Seoul or anywhere. <a href="https://www.instagram.com/ologressi/">contact</a>  </div>

<div class="wall">
	<div class="col"></div>   <!-- 1번째 줄: 사진 -->
	<div class="col"></div>   <!-- 2번째 줄: 사진 -->
	<div class="col"></div>   <!-- 3번째 줄: 영상 -->
</div>

<p class="msg" id="msg">loading...</p>

<!--
	1·2번째 줄: friends 채널의 사진을 랜덤으로 섞어 번갈아 넣어요
	3번째 줄: video 채널의 영상을 랜덤으로 섞어 넣어요
-->
<script>
	var photoChannel = "friends-qhmxcbtcejs";   // 사진 채널 (주소의 마지막 부분)
	var videoChannel = "video-ct2nvkemme4";     // 영상 채널 (주소의 마지막 부분)

	var cols = document.querySelectorAll(".col");
	var msg = document.getElementById("msg");

	// 아레나 블록 하나를 { kind, src/html, title } 모양으로 정리
	function tidy(b) {
		var a = b.attachment;
		if (a && a.url && (/video/.test(a.content_type || "") || /\.(mp4|webm|mov|m4v)(\?|$)/i.test(a.url))) {
			return { kind: "video", src: a.url, title: b.title };
		}
		if (b.embed && b.embed.html) {
			return { kind: "embed", html: b.embed.html, title: b.title };
		}
		if (b.image) {
			var im = b.image;
			var src = im.large ? (im.large.src || im.large.url)
			                   : (im.src || (im.display && im.display.url) || (im.original && im.original.url));
			if (src) return { kind: "image", src: src, title: b.title };
		}
		return null;   // 글·링크 등은 건너뜀
	}

	// 새 방식(v3)으로 채널 하나를 끝 페이지까지 불러오기
	function loadV3(channel, page, list) {
		return fetch("https://api.are.na/v3/channels/" + channel + "/contents?page=" + page)
			.then(function (res) {
				if (!res.ok) throw new Error(res.status);
				return res.json();
			})
			.then(function (json) {
				json.data.forEach(function (b) {
					var item = tidy(b);
					if (item) list.push(item);
				});
				if (json.meta && json.meta.has_more_pages) return loadV3(channel, page + 1, list);
				return list;
			});
	}

	// 예전 방식(v2) — v3가 안 될 때 대신 사용
	function loadV2(channel, page, list) {
		return fetch("https://api.are.na/v2/channels/" + channel + "/contents?page=" + page + "&per=100")
			.then(function (res) {
				if (!res.ok) throw new Error(res.status);
				return res.json();
			})
			.then(function (json) {
				json.contents.forEach(function (b) {
					var item = tidy(b);
					if (item) list.push(item);
				});
				if (json.contents.length === 100) return loadV2(channel, page + 1, list);
				return list;
			});
	}

	function load(channel) {
		return loadV3(channel, 1, []).catch(function () {
			return loadV2(channel, 1, []);
		});
	}

	// 순서를 랜덤으로 섞기 (들어올 때마다 바뀜)
	function shuffle(list) {
		for (var i = list.length - 1; i > 0; i--) {
			var j = Math.floor(Math.random() * (i + 1));
			var tmp = list[i];
			list[i] = list[j];
			list[j] = tmp;
		}
	}

	// 사진·영상 하나를 칸에 넣기 (클릭은 안 됨)
	function put(item, col) {
		var el;

		if (item.kind === "video") {
			el = document.createElement("video");
			el.src = item.src;
			el.muted = true;          // 소리 없이
			el.autoplay = true;       // 자동 재생
			el.loop = true;           // 반복
			el.playsInline = true;    // 아이폰에서 전체화면으로 안 튀어나가게
			el.preload = "metadata";
		} else if (item.kind === "embed") {
			el = document.createElement("div");
			el.className = "embed";
			el.innerHTML = item.html;
		} else {
			el = document.createElement("img");
			el.src = item.src;
			el.alt = item.title || "";
			el.loading = "lazy";
		}

		col.appendChild(el);
	}

	Promise.all([
		load(photoChannel).catch(function () { return null; }),
		load(videoChannel).catch(function () { return null; })
	]).then(function (result) {
		var photos = result[0];
		var videos = result[1];

		msg.remove();

		// 1·2번째 줄: 사진을 번갈아
		if (photos) {
			shuffle(photos);
			photos.forEach(function (p, n) {
				put(p, cols[n % 2]);
			});
		} else {
			cols[0].innerHTML = '<p>사진을 불러오지 못했어요.</p>';
		}

		// 3번째 줄: 영상
		if (videos) {
			shuffle(videos);
			videos.forEach(function (v) {
				put(v, cols[2]);
			});
		} else {
			cols[2].innerHTML = '<p>영상을 불러오지 못했어요.</p>';
		}
	});
</script>

</body>
</html>
